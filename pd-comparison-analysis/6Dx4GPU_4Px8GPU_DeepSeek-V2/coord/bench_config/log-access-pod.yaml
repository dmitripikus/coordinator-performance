apiVersion: v1
kind: Pod
metadata:
  name: model-cache-access
spec:
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sleep", "infinity"]
      volumeMounts:
        - name: model-cache
          mountPath: /model-cache
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"
  volumes:
    - name: model-cache
      persistentVolumeClaim:
        claimName: llm-d-model-cache
