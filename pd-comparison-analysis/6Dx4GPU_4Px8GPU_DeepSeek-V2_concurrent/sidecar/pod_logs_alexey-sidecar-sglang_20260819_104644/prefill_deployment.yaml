spec:
  progressDeadlineSeconds: 600
  replicas: 4
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      llm-d.ai/accelerator-variant: gpu
      llm-d.ai/accelerator-vendor: nvidia
      llm-d.ai/engine-type: vllm
      llm-d.ai/guide: pd-disaggregation
      llm-d.ai/model: DeepSeek-V2
      llm-d.ai/role: prefill
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        llm-d.ai/accelerator-variant: gpu
        llm-d.ai/accelerator-vendor: nvidia
        llm-d.ai/engine-type: vllm
        llm-d.ai/guide: pd-disaggregation
        llm-d.ai/model: DeepSeek-V2
        llm-d.ai/role: prefill
    spec:
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  llm-d.ai/accelerator-variant: gpu
                  llm-d.ai/accelerator-vendor: nvidia
                  llm-d.ai/engine-type: vllm
                  llm-d.ai/guide: pd-disaggregation
                  llm-d.ai/model: DeepSeek-V2
                  llm-d.ai/role: prefill
              topologyKey: kubernetes.io/hostname
            weight: 100
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                llm-d.ai/accelerator-variant: gpu
                llm-d.ai/accelerator-vendor: nvidia
                llm-d.ai/engine-type: vllm
                llm-d.ai/guide: pd-disaggregation
                llm-d.ai/model: DeepSeek-V2
                llm-d.ai/role: decode
            topologyKey: kubernetes.io/hostname
      containers:
      - args:
        - deepseek-ai/DeepSeek-V2
        - --disable-access-log-for-endpoints=/health,/metrics,/v1/models
        - --tensor-parallel-size=8
        - --block-size=128
        - --max-model-len=32000
        - --max-num-batched-tokens=16384
        - --kv-transfer-config
        - '{"kv_connector":"NixlConnector", "kv_role":"kv_both"}'
        - --load-format=runai_streamer
        - --model-loader-extra-config
        - '{"distributed":true,"concurrency":16,"memory_limit":17179869184}'
        - --no-disable-hybrid-kv-cache-manager
        command:
        - vllm
        - serve
        env:
        - name: HF_HOME
          value: /model-cache
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              key: HF_TOKEN
              name: llm-d-hf-token
        - name: VLLM_NIXL_SIDE_CHANNEL_HOST
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
          value: "120"
        - name: USER
          value: llm-d
        - name: UCX_MODULE_DIR
          value: /usr/local/lib/python3.12/dist-packages/nixl_cu13.libs/ucx
        image: vllm/vllm-openai:v0.23.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: modelserver
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        name: modelserver
        ports:
        - containerPort: 8000
          name: modelserver
          protocol: TCP
        - containerPort: 5600
          name: nixl
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /v1/models
            port: modelserver
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 2
        resources:
          limits:
            cpu: "16"
            memory: 400Gi
            nvidia.com/gpu: "8"
            rdma/ib: "1"
          requests:
            cpu: "16"
            memory: 400Gi
            nvidia.com/gpu: "8"
            rdma/ib: "1"
        startupProbe:
          failureThreshold: 120
          httpGet:
            path: /v1/models
            port: modelserver
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /model-cache
          name: model-cache
        - mountPath: /dev/shm
          name: shm
        - mountPath: /.cache
          name: torch-compile-cache
        - mountPath: /.config
          name: vllm-config
        - mountPath: /.triton
          name: triton-cache
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: pd-disaggregation-nvidia-gpu-vllm-sa
      serviceAccountName: pd-disaggregation-nvidia-gpu-vllm-sa
      terminationGracePeriodSeconds: 30
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: llm-d-model-cache
      - emptyDir:
          medium: Memory
          sizeLimit: 20Gi
        name: shm
      - emptyDir: {}
        name: torch-compile-cache
      - emptyDir: {}
        name: vllm-config
      - emptyDir: {}
        name: triton-cache
